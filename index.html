<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Welcome Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
        
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #004fb3;
        }
        
        .btn-register {
            background: #28a745;
        }
        
        .btn-register:hover {
            background: #218838;
        }
        
        .btn-forgot {
            background: #ffc107;
            color: #333;
        }
        
        .btn-forgot:hover {
            background: #e0a800;
        }
        
        .alert-error {
            background: #ffe6e6;
            color: #cc0000;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .alert-success {
            background: #e6ffed;
            color: #006622;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .link {
            color: #0066cc;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
            display: inline-block;
            text-decoration: underline;
        }
        
        .form-section {
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Welcome Portal</h2>


        <!-- MAIN PAGE OPTIONS (Step 1) -->
        <div id="main-options">
            <p style="color: #666; margin-bottom: 20px;">login page</p>
            <button class="btn-register" onclick="switchView('register-form')"> Create New Account</button>
            <button onclick="switchView('login-form')"> LogIn</button>
        </div>

        <!-- CREATE NEW ACCOUNT -->
        <form id="register-form" class="form-section" method="POST">
            <h3>Create New Account</h3>
            <input type="hidden" name="action_type" value="register">
            <input type="text" name="username" placeholder="Choose a Username" required>
            <input type="text" name="contact" placeholder="Email or Contact Number" required>
            <input type="password" name="password" placeholder="Choose a Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <input type="date" name="DOB" placeholder="Date of Birth" required>

            <button type="submit" class="btn-register">Create Account</button>
            <span class="link" onclick="switchView('main-options')">← Back to Options</span>
        </form>

        <!-- LOGIN -->
        <form id="login-form" class="form-section" method="POST">
            <h3>Log In</h3>
            <input type="hidden" name="action_type" value="login">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
            <span class="link" onclick="switchView('forgot-form')">Forgot Password?</span><br>
            <span class="link" onclick="switchView('main-options')">← Back to Options</span>
        </form>

        <!-- FORGOT PASSWORD FORM -->
        <form id="forgot-form" class="form-section" method="POST">
            <h3>Reset Password</h3>
            <p style="font-size: 13px; color: #666;">Enter your registered Email or Contact:</p>
            <input type="hidden" name="action_type" value="forgot">
            <input type="text" name="contact" placeholder="Email or Phone Number" required>
            <button type="submit" class="btn-forgot">Reset Password</button>
            <span class="link" onclick="switchView('login-form')">← Back to Login</span>
        </form>
    </div>

    <script>
        function switchView(formId) {
            document.getElementById('main-options').style.display = 'none';
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('forgot-form').style.display = 'none';

            document.getElementById(formId).style.display = 'block';
        }
    </script>

</body>

</html>
